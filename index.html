<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 운동 찾기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- 메인 화면 -->
    <section id="screen-main" class="screen is-active" aria-labelledby="main-title">
      <header class="hero">
        <p class="hero-eyebrow">1분 운동 추천</p>
        <h1 id="main-title" class="hero-title">질문 5개로 찾는<br />나에게 맞는 운동</h1>
        <p class="hero-desc">요즘 뜨는 운동까지 반영해 딱 3개만 골라드려요.</p>
        <button type="button" class="btn btn-primary btn-block" data-action="start">내 운동 찾기</button>
      </header>

      <section class="card trend" aria-labelledby="trend-title">
        <div class="trend-head">
          <h2 id="trend-title" class="section-title">이번 주 뜨는 운동 TOP 3</h2>
          <span id="trend-date" class="trend-date"></span>
        </div>
        <ol id="trend-list" class="trend-list"></ol>
      </section>
    </section>

    <!-- 질문 화면 -->
    <section id="screen-question" class="screen" aria-labelledby="question-title">
      <div class="topbar">
        <button type="button" class="btn btn-ghost" data-action="prev">← 이전</button>
        <span id="progress-text" class="progress-text"></span>
      </div>
      <div id="progress" class="progress" role="progressbar" aria-label="질문 진행률" aria-valuemin="0" aria-valuemax="5">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <!-- 필수 질문: 한 번에 1개씩 -->
      <div id="step-question">
        <h2 id="question-title" class="question-title"></h2>
        <div id="question-options" class="options" role="group" aria-labelledby="question-title"></div>
      </div>

      <!-- 마지막 질문 뒤: 세부항목 + 트렌드 토글 -->
      <div id="step-finish" hidden>
        <h2 class="question-title">거의 다 됐어요!</h2>

        <details id="detail-box" class="card details">
          <summary>세부항목 더 보기 <span class="optional">(선택)</span></summary>
          <div id="detail-questions" class="detail-questions"></div>
        </details>

        <label class="card toggle">
          <span class="toggle-text">
            <strong>요즘 뜨는 운동 우선 보기</strong>
            <small>이번 주 트렌드 운동에 가산점을 줘요</small>
          </span>
          <input id="trend-toggle" type="checkbox" class="toggle-input" checked />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>

        <button type="button" class="btn btn-primary btn-block" data-action="show-result">결과 보기</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" aria-labelledby="result-title">
      <h2 id="result-title" class="result-title">나에게 맞는 운동 3가지</h2>
      <ol id="result-list" class="result-list"></ol>
      <p id="result-error" class="result-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-block" data-action="start">다시 하기</button>
        <button type="button" class="btn btn-secondary btn-block" data-action="copy-link">결과 링크 복사</button>
        <p id="copy-status" class="copy-status" role="status"></p>
      </div>
    </section>
  </main>

  <script src="recommend.js"></script>
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
