<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)" />
  <title>내 운동 찾기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- 메인 화면 -->
    <section id="screen-main" class="screen is-active" aria-labelledby="main-title">
      <header class="hero">
        <span class="chip">⚡ 1분 운동 추천</span>
        <h1 id="main-title" class="hero-title">질문 5개로 찾는<br /><mark>나에게 딱 맞는</mark> 운동</h1>
        <p class="hero-desc">요즘 뜨는 운동까지 반영해서 딱 3개만 골라드려요.</p>
        <div id="hero-parade" class="parade" aria-hidden="true"></div>
        <button type="button" class="btn btn-primary btn-lg btn-block" data-action="start">내 운동 찾기 <span aria-hidden="true">→</span></button>
        <ul class="hero-stats">
          <li><strong id="stat-count">40+</strong>가지 운동</li>
          <li><strong>5</strong>개 질문</li>
          <li><strong>매주</strong> 트렌드 갱신</li>
        </ul>
      </header>

      <section class="card trend" aria-labelledby="trend-title">
        <div class="trend-head">
          <h2 id="trend-title" class="section-title">🔥 이번 주 뜨는 운동</h2>
          <span id="trend-date" class="pill"></span>
        </div>
        <ol id="trend-list" class="trend-list"></ol>
      </section>
    </section>

    <!-- 질문 화면 -->
    <section id="screen-question" class="screen" aria-labelledby="question-title">
      <div class="topbar">
        <button type="button" class="icon-btn" data-action="prev" aria-label="이전">←</button>
        <div id="progress" class="progress" role="progressbar" aria-label="질문 진행률" aria-valuemin="0" aria-valuemax="5">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text"></span>
      </div>

      <!-- 필수 질문: 한 번에 1개씩 -->
      <div id="step-question" class="step">
        <span id="step-label" class="step-label"></span>
        <h2 id="question-title" class="question-title"></h2>
        <div id="question-options" class="options" role="group" aria-labelledby="question-title"></div>
      </div>

      <!-- 마지막 질문 뒤: 세부항목 + 트렌드 토글 -->
      <div id="step-finish" class="step" hidden>
        <span class="step-label">LAST</span>
        <h2 class="question-title">거의 다 됐어요! 🙌</h2>
        <p class="question-sub">더 정확한 추천을 원하면 세부항목도 골라보세요.</p>

        <details id="detail-box" class="card details">
          <summary>세부항목 더 보기 <span class="optional">선택</span></summary>
          <div id="detail-questions" class="detail-questions"></div>
        </details>

        <label class="card toggle">
          <span class="toggle-text">
            <strong>요즘 뜨는 운동 우선 보기</strong>
            <small>이번 주 트렌드 운동에 가산점을 줘요</small>
          </span>
          <input id="trend-toggle" type="checkbox" class="toggle-input" checked />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>

        <button type="button" class="btn btn-primary btn-lg btn-block" data-action="show-result">결과 보기 <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" aria-labelledby="result-title">
      <header class="result-header">
        <span class="chip">🎉 추천 완료</span>
        <h2 id="result-title" class="result-title">나에게 맞는 운동 TOP 3</h2>
        <p id="result-sub" class="result-sub">답변과 이번 주 트렌드를 바탕으로 골랐어요.</p>
      </header>
      <ol id="result-list" class="result-list"></ol>
      <p id="result-error" class="result-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-lg btn-block" data-action="copy-link">결과 링크 복사</button>
        <button type="button" class="btn btn-secondary btn-lg btn-block" data-action="start">다시 하기</button>
        <p id="copy-status" class="copy-status" role="status"></p>
      </div>
    </section>
  </main>

  <script src="recommend.js"></script>
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
