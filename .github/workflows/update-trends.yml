name: Update trends

on:
  schedule:
    # 매주 월요일 09:00 (한국 시간) = 월요일 00:00 UTC
    - cron: "0 0 * * 1"
  # Actions 탭의 "Run workflow" 버튼으로 수동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch news and rebuild trends.json
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: node scripts/update-trends.js

      # 실패하면 위 단계에서 멈추므로, 여기까지 오면 새 trends.json이 만들어진 상태
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then
            echo "trends.json 변경 없음"
          else
            git commit -m "Update trends ($(TZ=Asia/Seoul date +%F))"
            git push
          fi
